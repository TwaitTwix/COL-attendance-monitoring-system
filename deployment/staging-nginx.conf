server {
    listen 80;
    server_name staging.attendance.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.attendance.example.com;

    root /var/www/attendance-monitoring-system/backend/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/staging.attendance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.attendance.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(?:\.env|.*\.env.*|config|vendor) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param APP_ENV staging;
        fastcgi_param APP_DEBUG false;
    }

    location ~ /\.ht {
        deny all;
    }
}
