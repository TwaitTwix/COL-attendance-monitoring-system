<VirtualHost *:80>
    ServerName staging.attendance.example.com
    Redirect permanent / https://staging.attendance.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName staging.attendance.example.com
    DocumentRoot /var/www/attendance-monitoring-system/backend/public
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/staging.attendance.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staging.attendance.example.com/privkey.pem

    <Directory /var/www/attendance-monitoring-system/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^(\.env|.*\.env.*)$">
        Require all denied
    </FilesMatch>

    SetEnv APP_ENV staging
    SetEnv APP_DEBUG false

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/attendance-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/attendance-staging-access.log combined
</VirtualHost>
